<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Sign Up</title>
    </head>

    <body>

        <div class="container">
            <h1>Sign Up</h1>

            <form action="/users" method="POST">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input id="firstName" class="form-control" type="text" name="firstName" placeholder="First Name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input id="lastName" class="form-control" type="text" name="lastName" placeholder="Last Name">
                    </div>

                     <div class="form-group">
                        <label for="email">Email:</label>
                        <input id="email" class="form-control" type="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input id="password" type="password" class="form-control" name="password"  placeholder="Password" required>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>

            <p>Already a member? <a href="/login.html">Log In</a></p>

        </div>
    </body>

</html>
