<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Sign In</title>
    </head>

    <body>
        <div class="container">
            <h1>Login</h1>
            <h3 id="successful-signup-message"></h3>

            <form action="/users/login" method="POST">
                <div class="form-group">
                    <label for="email">Email address:</label>
                    <input id="email" class="form-control" type="email"  name="email" aria-describedby="emailHelp" placeholder="Enter email" required>
                    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input id="password" type="password" class="form-control" name="password"  placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <p>Don't have an account yet? <a href="signup.html">Create Account</a></p>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const message = params.get('message');

            if(message) {
                const messageElem = document.getElementById('successful-signup-message');
                messageElem.textContent = message;
                window.history.replaceState({}, '', '/login.html');
                setTimeout(() => {
                    messageElem.textContent = '';
                }, 2500);
            }
        </script>

    </body>
</html>
